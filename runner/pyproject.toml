[project]
name = "rr-runner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.102",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
rr = "rr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
